name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run tests (stdlib only, no deps)
        run: python -m pytest tests/ -q
      - name: Run demo smoke test
        run: python examples/demo.py
      - name: Run phase-2 demo smoke test
        run: python examples/demo_phase2.py
