name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Free-tier Zen model: zero-retention, limited-time free.
# To swap models, change `model:` to e.g. opencode/big-pickle
# (full list: https://opencode.ai/docs/zen/#pricing).
# Each /oc comment = one Actions run (30m cap), parallel across issues.
jobs:
  opencode:
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/space-bunny-free
          use_github_token: true
